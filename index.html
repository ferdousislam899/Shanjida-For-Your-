<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Sanjida ❤️ | A Little Surprise</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Hind Siliguri","Poppins",sans-serif;
    background:#05020a;
    color:#fff;
    overflow-x:hidden;
}

body.locked{
    overflow:hidden;
}


/* =========================================================
   BACKGROUND
========================================================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-10;

    background:
    radial-gradient(circle at 15% 20%,rgba(255,45,130,.18),transparent 28%),
    radial-gradient(circle at 85% 30%,rgba(125,60,255,.18),transparent 30%),
    radial-gradient(circle at 50% 90%,rgba(255,80,180,.10),transparent 30%),
    linear-gradient(135deg,#030107,#0c0414,#05020a);
}

#stars{
    position:fixed;
    inset:0;
    z-index:-3;
    pointer-events:none;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#fff;
    animation:twinkle 3s infinite ease-in-out;
}

@keyframes twinkle{

    0%,100%{
        opacity:.15;
        transform:scale(.7);
    }

    50%{
        opacity:1;
        transform:scale(1.5);
    }
}


/* =========================================================
   FLOATING HEARTS
========================================================= */

#hearts{
    position:fixed;
    inset:0;
    z-index:5;
    pointer-events:none;
}

.heart{
    position:absolute;
    bottom:-40px;

    color:#ff65a5;
    font-size:20px;

    animation:heartFloat linear forwards;

    filter:drop-shadow(0 0 8px #ff4f9a);
}

@keyframes heartFloat{

    0%{
        transform:translateY(0) rotate(0);
        opacity:0;
    }

    15%{
        opacity:.9;
    }

    100%{
        transform:translateY(-115vh) rotate(360deg);
        opacity:0;
    }
}


/* =========================================================
   PASSWORD SCREEN
========================================================= */

#passwordScreen{
    position:fixed;
    inset:0;

    z-index:9999;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:
    radial-gradient(circle at center,
    rgba(255,40,130,.20),
    transparent 35%),
    #030107;

    transition:1s ease;
}

#passwordScreen.hide{
    opacity:0;
    visibility:hidden;
    transform:scale(1.08);
}

.passwordBox{

    width:min(430px,100%);

    padding:42px 28px;

    text-align:center;

    border-radius:30px;

    background:rgba(255,255,255,.055);

    border:1px solid rgba(255,255,255,.15);

    backdrop-filter:blur(25px);

    box-shadow:
    0 30px 100px rgba(0,0,0,.7),
    0 0 70px rgba(255,40,140,.10);
}

.lockIcon{

    width:100px;
    height:100px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    font-size:45px;

    background:
    linear-gradient(135deg,#ff3f91,#914cff);

    box-shadow:
    0 0 35px rgba(255,60,150,.4),
    0 0 80px rgba(140,60,255,.2);

    animation:lockFloat 3s infinite ease-in-out;
}

@keyframes lockFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-12px);
    }
}

.passwordBox h1{

    margin-top:25px;

    font-family:"Great Vibes",cursive;

    font-size:48px;

    font-weight:400;
}

.passwordBox p{

    color:#d4c8d5;

    line-height:1.9;

    margin:10px 0 20px;
}

.passwordInput{

    width:100%;

    padding:15px;

    border-radius:15px;

    border:1px solid rgba(255,255,255,.18);

    background:rgba(0,0,0,.35);

    color:#fff;

    text-align:center;

    font-size:20px;

    letter-spacing:7px;

    outline:none;
}

.passwordInput:focus{

    border-color:#ff6ba8;

    box-shadow:
    0 0 20px rgba(255,80,160,.2);
}

.btn{

    border:none;

    padding:14px 27px;

    border-radius:50px;

    color:white;

    background:
    linear-gradient(90deg,#ff3f91,#9b52ff);

    cursor:pointer;

    font-size:15px;

    box-shadow:
    0 12px 35px rgba(255,50,140,.25);

    transition:.3s;
}

.btn:hover{

    transform:
    translateY(-4px)
    scale(1.03);
}

#error{

    height:25px;

    margin-top:10px;

    color:#ff83b4;
}


/* =========================================================
   GENERAL
========================================================= */

section{

    min-height:100vh;

    padding:100px 20px;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;
}

.container{

    width:min(1050px,100%);

    margin:auto;
}

.center{
    text-align:center;
}

.eyebrow{

    color:#ff8dbb;

    font-size:13px;

    letter-spacing:4px;

    text-transform:uppercase;
}

h2{

    font-family:"Great Vibes",cursive;

    font-size:clamp(48px,8vw,75px);

    font-weight:400;

    margin:10px 0 25px;
}

.lead{

    max-width:700px;

    margin:auto;

    color:#cfc3d1;

    line-height:2;
}


/* =========================================================
   GLASS
========================================================= */

.glass{

    background:
    linear-gradient(
    135deg,
    rgba(255,255,255,.075),
    rgba(255,255,255,.025)
    );

    border:

    1px solid
    rgba(255,255,255,.12);

    backdrop-filter:blur(20px);

    border-radius:28px;

    box-shadow:
    0 25px 80px rgba(0,0,0,.4);
}


/* =========================================================
   HERO
========================================================= */

.hero{

    min-height:100vh;

    text-align:center;

    overflow:hidden;
}

.heroTitle{

    font-family:"Great Vibes",cursive;

    font-size:clamp(65px,13vw,135px);

    line-height:.95;

    margin:25px 0;

    background:
    linear-gradient(
    90deg,
    #fff,
    #ff79ad,
    #d79aff,
    #fff
    );

    background-size:300%;

    -webkit-background-clip:text;

    color:transparent;

    animation:titleShine 7s linear infinite;

    filter:
    drop-shadow(0 0 20px rgba(255,70,160,.25));
}

@keyframes titleShine{

    to{
        background-position:300%;
    }
}

.heroText{

    max-width:700px;

    margin:25px auto;

    color:#d6cbd7;

    line-height:2;

    font-size:17px;
}

.heroPhoto{

    width:230px;

    height:230px;

    margin:30px auto;

    display:block;

    object-fit:cover;

    border-radius:50%;

    border:5px solid rgba(255,255,255,.12);

    box-shadow:
    0 0 40px rgba(255,70,150,.3),
    0 0 100px rgba(140,70,255,.15);

    animation:photoFloat 4s ease-in-out infinite;
}

@keyframes photoFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-12px);
    }
}

.scroll{

    margin-top:30px;

    color:#ffffff77;

    font-size:14px;
}


/* =========================================================
   LETTER
========================================================= */

.letter{

    max-width:850px;

    margin:auto;

    padding:45px;

    line-height:2.2;

    color:#e4d8e4;

    font-size:17px;
}

.letter p{

    margin-bottom:18px;
}

.letter strong{

    color:#ff91ba;
}

.signature{

    margin-top:30px;

    text-align:right;

    font-family:"Great Vibes",cursive;

    color:#ff91ba;

    font-size:35px;
}


/* =========================================================
   SPECIAL CARDS
========================================================= */

.cards{

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:20px;

    margin-top:45px;
}

.card{

    padding:30px 20px;

    text-align:center;

    transition:.5s;

    transform-style:preserve-3d;
}

.card:hover{

    transform:
    perspective(800px)
    rotateX(5deg)
    rotateY(-6deg)
    translateY(-12px);
}

.card .icon{

    font-size:40px;

    margin-bottom:15px;
}

.card h3{

    font-family:"Poppins",sans-serif;

    margin-bottom:10px;
}

.card p{

    color:#c8bdca;

    line-height:1.8;

    font-size:14px;
}


/* =========================================================
   QUALITIES
========================================================= */

.qualities{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:20px;

    margin-top:45px;
}

.quality{

    padding:28px;

    display:flex;

    align-items:center;

    gap:20px;

    transition:.4s;
}

.quality:hover{

    transform:translateY(-7px);

    border-color:
    rgba(255,110,180,.35);
}

.quality .icon{

    font-size:35px;
}

.quality b{

    font-size:18px;
}

.quality small{

    display:block;

    color:#c6bac7;

    margin-top:6px;

    line-height:1.7;
}


/* =========================================================
   GALLERY
========================================================= */

.gallery{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:25px;

    margin-top:45px;
}

.photoCard{

    position:relative;

    overflow:hidden;

    height:560px;

    border-radius:28px;

    border:
    1px solid
    rgba(255,255,255,.13);

    background:#100816;
}

.photoCard img{

    width:100%;

    height:100%;

    object-fit:cover;

    transition:1s;
}

.photoCard:hover img{

    transform:scale(1.08);
}

.photoCaption{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    padding:
    70px 25px 25px;

    background:
    linear-gradient(
    transparent,
    rgba(0,0,0,.9)
    );

    font-size:17px;
}


/* =========================================================
   STORY
========================================================= */

.story{

    display:grid;

    grid-template-columns:
    .8fr 1.2fr;

    gap:35px;

    margin-top:45px;

    align-items:center;
}

.myPhoto{

    height:600px;

    overflow:hidden;

    border-radius:30px;

    border:
    1px solid
    rgba(255,255,255,.12);

    box-shadow:
    0 30px 80px rgba(0,0,0,.4);
}

.myPhoto img{

    width:100%;

    height:100%;

    object-fit:cover;

    transition:.8s;
}

.myPhoto:hover img{

    transform:scale(1.05);
}

.storyText{

    padding:40px;

    color:#d6cad6;

    line-height:2.1;

    font-size:16px;
}

.storyText p{

    margin-bottom:18px;
}

.storyText strong{

    color:#ff8eb8;
}


/* =========================================================
   TIMELINE
========================================================= */

.timeline{

    max-width:800px;

    margin:45px auto;
}

.timelineItem{

    display:flex;

    gap:18px;

    margin-bottom:22px;
}

.timelineIcon{

    min-width:48px;

    height:48px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    background:
    linear-gradient(
    135deg,
    #ff4c9a,
    #8f5dff
    );

    box-shadow:
    0 0 20px rgba(255,70,150,.2);
}

.timelineText{

    flex:1;

    padding:20px 25px;
}

.timelineText h3{

    font-family:"Poppins",sans-serif;

    margin-bottom:5px;
}

.timelineText p{

    color:#c8bdca;

    line-height:1.8;
}


/* =========================================================
   3D GIFT
========================================================= */

.giftArea{

    text-align:center;

    perspective:1000px;
}

.gift{

    width:190px;

    height:160px;

    margin:55px auto 30px;

    position:relative;

    cursor:pointer;

    transform-style:preserve-3d;

    animation:giftFloat 3s ease-in-out infinite;
}

@keyframes giftFloat{

    0%,100%{
        transform:
        translateY(0)
        rotateY(-7deg);
    }

    50%{
        transform:
        translateY(-18px)
        rotateY(7deg);
    }
}

.giftBox{

    position:absolute;

    bottom:0;

    left:10px;

    width:170px;

    height:110px;

    border-radius:10px;

    background:
    linear-gradient(
    135deg,
    #ff2f82,
    #9b4dff
    );

    box-shadow:
    0 25px 50px rgba(255,40,130,.3);
}

.giftBox::after{

    content:"";

    position:absolute;

    left:70px;

    top:0;

    width:30px;

    height:100%;

    background:
    linear-gradient(
    #ffe27a,
    #ffc94e
    );
}

.giftLid{

    position:absolute;

    top:20px;

    left:0;

    width:190px;

    height:40px;

    border-radius:10px;

    background:
    linear-gradient(
    135deg,
    #ff579b,
    #b24dff
    );

    z-index:5;

    transform-origin:left bottom;

    transition:1s;
}

.gift.open .giftLid{

    transform:
    rotate(-28deg)
    translateY(-35px);
}

.giftBow{

    position:absolute;

    z-index:7;

    top:-5px;

    left:70px;

    width:50px;

    height:40px;
}

.giftBow::before,
.giftBow::after{

    content:"";

    position:absolute;

    width:42px;

    height:30px;

    border:
    9px solid
    #ffd65c;

    border-radius:50%;
}

.giftBow::before{

    left:-25px;

    transform:rotate(25deg);
}

.giftBow::after{

    right:-25px;

    transform:rotate(-25deg);
}

.giftRibbon{

    position:absolute;

    left:80px;

    top:20px;

    width:30px;

    height:140px;

    z-index:6;

    background:
    rgba(255,225,100,.8);
}

.giftMessage{

    max-width:650px;

    margin:25px auto;

    padding:30px;

    display:none;
}

.giftMessage.show{

    display:block;

    animation:appear .8s ease;
}


/* =========================================================
   SECRET
========================================================= */

.secretBox{

    max-width:700px;

    margin:auto;

    padding:40px;

    text-align:center;
}

.secretLock{

    font-size:65px;

    animation:lockFloat 3s infinite;
}

.secretMessage{

    display:none;

    margin-top:30px;

    padding-top:25px;

    border-top:
    1px solid
    rgba(255,255,255,.12);

    color:#d8ccd8;

    line-height:2;
}

.secretMessage.show{

    display:block;

    animation:appear .8s ease;
}


/* =========================================================
   QUOTE
========================================================= */

.quote{

    max-width:800px;

    margin:45px auto;

    padding:45px;

    text-align:center;

    font-family:"Great Vibes",cursive;

    font-size:
    clamp(35px,6vw,60px);

    line-height:1.4;

    color:#ffe4ef;
}


/* =========================================================
   ENVELOPE
========================================================= */

.envelopeArea{

    text-align:center;
}

.envelope{

    width:190px;

    height:130px;

    margin:50px auto 25px;

    position:relative;

    cursor:pointer;

    perspective:700px;
}

.envBody{

    position:absolute;

    inset:0;

    border-radius:12px;

    background:
    linear-gradient(
    135deg,
    #ff63a8,
    #8b62ff
    );

    box-shadow:
    0 20px 50px rgba(255,60,150,.25);
}

.envFlap{

    position:absolute;

    left:0;
    right:0;
    top:0;

    height:75px;

    z-index:3;

    background:#ffafd2;

    clip-path:
    polygon(
    0 0,
    100% 0,
    50% 100%
    );

    transform-origin:top;

    transition:.8s;
}

.envelope.open .envFlap{

    transform:
    rotateX(180deg);
}

.missMessage{

    display:none;

    max-width:650px;

    margin:auto;

    padding:30px;

    line-height:2;

    color:#d9ced9;
}

.missMessage.show{

    display:block;

    animation:appear .8s ease;
}


/* =========================================================
   FINAL
========================================================= */

.final{

    text-align:center;

    min-height:100vh;
}

.final h2{

    font-size:
    clamp(60px,12vw,125px);

    line-height:1;
}

.finalPhoto{

    width:170px;

    height:170px;

    margin:35px auto;

    overflow:hidden;

    border-radius:50%;

    border:
    4px solid
    rgba(255,255,255,.15);

    box-shadow:
    0 0 50px rgba(255,70,150,.35);
}

.finalPhoto img{

    width:100%;

    height:100%;

    object-fit:cover;
}

.finalText{

    max-width:650px;

    margin:auto;

    color:#d2c5d3;

    line-height:2;
}

.finalSignature{

    margin-top:30px;

    font-family:"Great Vibes",cursive;

    font-size:45px;

    color:#ff91ba;
}


/* =========================================================
   CONFETTI
========================================================= */

.confetti{

    position:fixed;

    top:-20px;

    width:8px;

    height:14px;

    z-index:10000;

    pointer-events:none;

    animation:
    confettiFall 4s linear forwards;
}

@keyframes confettiFall{

    to{

        transform:
        translateY(110vh)
        rotate(720deg);

        opacity:0;
    }
}


/* =========================================================
   MUSIC BUTTON
========================================================= */

.musicButton{

    position:fixed;

    right:20px;

    bottom:20px;

    z-index:100;

    width:52px;

    height:52px;

    border-radius:50%;

    border:
    1px solid
    rgba(255,255,255,.15);

    background:
    rgba(15,8,20,.8);

    color:#fff;

    cursor:pointer;

    backdrop-filter:blur(15px);
}


/* =========================================================
   BACK TO TOP
========================================================= */

.topButton{

    position:fixed;

    left:20px;

    bottom:20px;

    z-index:100;

    width:45px;

    height:45px;

    border-radius:50%;

    border:
    1px solid
    rgba(255,255,255,.15);

    background:
    rgba(15,8,20,.8);

    color:#fff;

    cursor:pointer;
}


/* =========================================================
   ANIMATION
========================================================= */

@keyframes appear{

    from{

        opacity:0;

        transform:
        translateY(25px);
    }

    to{

        opacity:1;

        transform:none;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:850px){

    .cards{

        grid-template-columns:
        repeat(2,1fr);
    }

    .story{

        grid-template-columns:1fr;
    }

    .gallery{

        grid-template-columns:1fr;
    }

    .qualities{

        grid-template-columns:1fr;
    }

    .myPhoto{

        height:500px;
    }
}

@media(max-width:550px){

    section{

        padding:75px 15px;
    }

    .heroTitle{

        font-size:65px;
    }

    .heroPhoto{

        width:190px;
        height:190px;
    }

    .cards{

        grid-template-columns:1fr;
    }

    .letter{

        padding:25px 20px;

        font-size:16px;
    }

    .gallery{

        gap:15px;
    }

    .photoCard{

        height:480px;
    }

    .storyText{

        padding:25px 20px;
    }

    .myPhoto{

        height:450px;
    }

    .secretBox{

        padding:25px 18px;
    }

    .quote{

        padding:30px 20px;
    }
}

</style>
</head>

</script>

</body>
        </html>
